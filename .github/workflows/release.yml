# PanBox 三平台发布构建（Windows NSIS / Android APK / iOS TrollStore）
# 构建壳仓：不含源码——经最小权限 PAT 只读检出私有源码仓 alonjoik/panbox 完成构建，
# 三平台并行产物统一挂同一个 Draft Release（方案见主仓 docs/ci-cd-multiplatform.md）。
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（须与 src-tauri/tauri.conf.json 的 version 一致，如 0.1.11）'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows }
          - { os: ubuntu-latest,  name: android }
          - { os: macos-15,       name: ios }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: alonjoik/panbox        # 私有源码仓（PRIVATE_REPO_TOKEN 仅只读该仓）
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci

      # 版本漂移提醒：产物内嵌版本以 tauri.conf.json 为准
      - name: Version check
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$CONF" != "${{ github.event.inputs.version }}" ] && [ "$CONF" != "${{ github.event.inputs.version }}" ]; then
            echo "::warning::输入版本 ${{ github.event.inputs.version }} 与 tauri.conf.json 的 $CONF 不一致，产物内嵌版本以 conf 为准"
          fi

      # —— Windows：NSIS 安装包（砍 MSI：WiX 慢、体积翻倍且从不分发）——
      - name: Build Windows (NSIS)
        if: matrix.name == 'windows'
        run: npx tauri build --bundles nsis

      # —— Android：JDK17 + NDK + 双架构 APK（gen/ 不入库，CI 内 init + sed 补丁）——
      # runner 自带 Android SDK；setup-android@v3 在新镜像装已废弃的 tools 包必炸，不用
      - uses: actions/setup-java@v4
        if: matrix.name == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install NDK
        if: matrix.name == 'android'
        run: |
          # sdkmanager 不在 PATH：定位 runner 自带 cmdline-tools（latest 链接缺失时兜底查找）
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -path "*/bin/*" | head -1)
          yes | "$SDKM" --install "ndk;27.0.12077973" >/dev/null
      - name: Add Android rust targets
        if: matrix.name == 'android'
        run: rustup target add aarch64-linux-android armv7-linux-androideabi
      - name: Build Android APK (arm64 + armv7)
        if: matrix.name == 'android'
        run: |
          # rquickjs 的 bindgen 交叉编译须指向 NDK sysroot（否则用 host glibc 头必炸）
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.0.12077973"
          export BINDGEN_EXTRA_CLANG_ARGS="--sysroot=$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          npx tauri android init
          # 允许 http 明文流量（源站多为 http）：新版 tauri 用 gradle 占位符控制
          # cleartext（manifest 已内置 android:usesCleartextTraffic="${usesCleartextTraffic}"，
          # 再对 manifest 插属性会因同名重复导致 merger 解析失败）
          sed -i 's|manifestPlaceholders\["usesCleartextTraffic"\] = "false"|manifestPlaceholders["usesCleartextTraffic"] = "true"|' src-tauri/gen/android/app/build.gradle.kts
          npx tauri android build --apk --target aarch64 armv7

      # —— iOS：TrollStore 免签链（unsigned archive + ldid ad-hoc 重签）——
      # 新版 CLI target 取值只有 aarch64/aarch64-sim/x86_64（ios_aarch64 已废弃）
      - name: Add iOS rust target
        if: matrix.name == 'ios'
        run: rustup target add aarch64-apple-ios
      - name: Build iOS (unsigned archive)
        if: matrix.name == 'ios'
        run: |
          npx tauri ios init
          # 允许 http 明文流量（init 生成于 src-tauri/gen/apple）
          PLIST=$(find src-tauri/gen/apple -name "*_Info.plist" | head -1)
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" || true
          # 免签：向全部 buildSettings 配置块注入免签设置（format 77 工程未必有
          # CODE_SIGN_STYLE 行可替换，锚 buildSettings = { 必命中；不能绕过 tauri
          # 封装直调 xcodebuild——Rust script phase 依赖 CLI 运行时写出的协调文件）
          PBX=$(find src-tauri/gen/apple -name project.pbxproj | head -1)
          sed -i '' 's/buildSettings = {/buildSettings = { CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = ""; CODE_SIGNING_ALLOWED = NO;/g' "$PBX"
          npx tauri ios build --target aarch64 --export-method debugging || true
      - name: Repack IPA (ad-hoc sign via ldid)
        if: matrix.name == 'ios'
        run: |
          brew install ldid
          # 产物优先取工程内 derivedDataPath，未指定时落在 Xcode 默认 DerivedData
          APP=$(find src-tauri/gen/apple/build "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 7 \
            -type d -name "*.app" -path "*iphoneos*" 2>/dev/null | head -1)
          [ -z "$APP" ] && APP=$(find src-tauri/gen/apple/build -type d -name "*.app" 2>/dev/null | head -1)
          # build 步骤的 || true 会吞 archive 失败，这里显式拦截避免空 APP 一路错到底
          [ -z "$APP" ] && { echo "::error::未找到 .app——tauri ios build 失败，请查上方 xcodebuild 日志"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          ldid -S "Payload/$(basename "$APP")/$(basename "$APP" .app)"
          zip -qry PanBox-trollstore.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            PanBox-trollstore.ipa

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          ls -la dist/
          # release job 未 checkout 仓库（工作目录无 .git），须显式 --target 指定建 tag 的 commit
          gh release create "$VERSION" --draft --target "$GITHUB_SHA" --title "PanBox $VERSION" dist/* || \
          gh release upload "$VERSION" dist/*
